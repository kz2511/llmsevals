name: Release

# Triggered when a version tag (e.g. v1.0.0) is pushed.
# Creates a GitHub Release and publishes the package to PyPI.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"         # v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"  # v1.0.0a1  (alpha)
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"  # v1.0.0b1  (beta)
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+" # v1.0.0rc1 (release candidate)

permissions:
  contents: write   # needed to create GitHub Releases
  id-token: write   # needed for PyPI Trusted Publisher (OIDC)

jobs:
  # ── Build sdist + wheel ──────────────────────────────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Run full test suite before releasing ────────────────────────────────
  test:
    name: Final Test Run
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[openai,dev]"

      - name: Run offline tests
        run: |
          pytest tests/ -v \
            -m "not integration and not provider_integration" \
            --tb=short

  # ── Publish to PyPI via Trusted Publisher (OIDC) ────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, test]
    environment:
      name: pypi
      url: https://pypi.org/project/llmsevals/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC Trusted Publisher — no API token needed.
        # Configure at: https://pypi.org/manage/project/llmsevals/settings/publishing/

  # ── Create GitHub Release ────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this release
        id: changelog
        run: |
          # Pull the section for this version from CHANGELOG.md
          python - <<'EOF'
          import re, os, sys

          version = os.environ["VERSION"]
          changelog = open("CHANGELOG.md").read()

          # Match ## [X.Y.Z] ... down to the next ## [
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)"
          match = re.search(pattern, changelog, re.DOTALL)
          if not match:
              print(f"WARNING: No changelog entry found for version {version}", file=sys.stderr)
              notes = f"Release {version}"
          else:
              notes = match.group(0).strip()

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              # Use heredoc delimiter to handle multi-line output
              fh.write("NOTES<<CHANGELOG_EOF\n")
              fh.write(notes + "\n")
              fh.write("CHANGELOG_EOF\n")
          EOF
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "llmsevals v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: dist/*
